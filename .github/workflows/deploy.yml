name: Deploy

# Pull requests run the checks only. A push to main runs the checks, applies new
# D1 migrations and deploys to Cloudflare Pages (production).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Migrations before code: new code may need the new tables.
      - run: npx wrangler d1 migrations apply manexus-intents --remote
      - run: npx wrangler pages deploy dist --project-name manexus-intents --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
      - run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://manexus-intents.pages.dev/api/health
